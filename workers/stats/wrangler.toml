name = "wordaholic-stats"
main = "src/index.js"
compatibility_date = "2026-08-27"
# One-shot history import (wrangler secret put, do not commit):
#   STATS_IMPORT_TOKEN
# Local wrangler dev reads workers/stats/.dev.vars (STATS_IMPORT_TOKEN, LOCAL_GEO).

[[durable_objects.bindings]]
name = "STATS"
class_name = "StatsStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StatsStore"]

[[routes]]
pattern = "wordaholic.volvovski.com/api/*"
zone_name = "volvovski.com"

# Prefix: exact /stats does not match /stats/ (browsers and links often add the slash).
[[routes]]
pattern = "wordaholic.volvovski.com/stats*"
zone_name = "volvovski.com"
