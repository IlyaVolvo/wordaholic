<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a3a4a" />
  <link rel="manifest" href="/site.webmanifest" />
  <title>Wordaholic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div id="prep-overlay" class="prep-overlay prep-overlay-corner" hidden>
    <div class="prep-card">
      <p id="prep-label">Preparing offline…</p>
      <div class="prep-track"><div id="prep-bar" class="prep-bar"></div></div>
    </div>
  </div>

  <main>
    <section data-view="map" class="view map-view">
      <div class="map-toolbar">
        <div class="map-toolbar-start">
          <div id="fav-chips" class="fav-chips" aria-label="Selected languages"></div>
        </div>

        <button type="button" id="btn-about" class="brand-mark" title="About Wordaholic" aria-label="About Wordaholic">
          <img class="brand-mark-svg" src="/brand/wordaholic-mark.svg" width="40" height="40" alt="" />
        </button>

        <div class="map-toolbar-end">
          <div id="game-rail" class="game-rail" aria-label="Games"></div>
        </div>
      </div>
      <div id="map-root" class="map-root"></div>
    </section>
  </main>

  <div id="about-dialog" class="about-dialog" hidden>
    <div class="about-dialog-backdrop" data-about-close></div>
    <div class="about-dialog-card" role="dialog" aria-modal="true" aria-labelledby="about-title">
      <div class="about-hero">
        <span class="about-hero-mark" aria-hidden="true">
          <img src="/brand/wordaholic-mark.svg" width="56" height="56" alt="" />
        </span>
        <div>
          <h2 id="about-title">Wordaholic</h2>
          <p class="about-lead">Offline multi-language word games — play anywhere, keep your favorites ready.</p>
        </div>
      </div>
      <dl class="about-meta">
        <div>
          <dt>Author</dt>
          <dd>Ilya Volvovski</dd>
        </div>
        <div>
          <dt>Build</dt>
          <dd id="about-built">—</dd>
        </div>
        <div>
          <dt>Commit</dt>
          <dd id="about-commit">—</dd>
        </div>
      </dl>
      <div class="about-actions">
        <button type="button" class="btn primary" data-about-close>Close</button>
      </div>
    </div>
  </div>

  <div id="feedback-dialog" class="feedback-dialog" hidden>
    <div class="feedback-dialog-backdrop" data-feedback-close></div>
    <div class="feedback-dialog-card" role="dialog" aria-modal="true" aria-labelledby="feedback-title">
      <h2 id="feedback-title">Send feedback</h2>
      <p class="feedback-lead">Copy the address and email your note from any mail app.</p>
      <p class="feedback-email" id="feedback-author-email">ivolvo12@gmail.com</p>
      <textarea id="feedback-text" class="feedback-textarea" rows="4" placeholder="Optional: draft your note here, then paste it into the email…"></textarea>
      <p id="feedback-status" class="feedback-status" hidden></p>
      <div class="feedback-actions">
        <button type="button" class="btn ghost" data-feedback-close>Close</button>
        <button type="button" class="btn ghost" id="btn-feedback-copy-note">Copy note</button>
        <button type="button" class="btn primary" id="btn-feedback-copy">Copy address</button>
      </div>
    </div>
  </div>

  <script type="module" src="/app/main.js"></script>
</body>
</html>
