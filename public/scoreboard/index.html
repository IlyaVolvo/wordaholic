<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Scoreboard — Wordaholic</title>
  <link rel="icon" href="/brand/wordaholic-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/app.css" />
  <link rel="stylesheet" href="/scoreboard/scoreboard.css" />
</head>
<body>
  <main class="scoreboard-page">
    <header class="scoreboard-bar">
      <a href="/">Wordaholic</a>
      <h1>Scoreboard</h1>
      <label>Names <input id="limit" type="number" min="1" max="100" value="3"></label>
    </header>
    <p class="scoreboard-note">Today, this week (from Monday), this month, this year, and lifetime use this device’s calendar. A name is set on the home page.</p>
    <div id="boards"></div>
    <form class="scoreboard-add" onsubmit="return false">
      <select id="catalog"></select>
      <select id="board-kind">
        <option value="average">Average</option>
        <option value="best">Letterix best</option>
      </select>
      <button type="button" class="btn primary" id="add">Show</button>
    </form>
  </main>
  <script type="module" src="/app/scoreboard/page.js"></script>
</body>
</html>
