<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iPhone sim</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #1c1c1f;
      font: 14px/1.3 system-ui, sans-serif;
      color: #d0d0d4;
    }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    nav a {
      color: #9aa0b5;
      text-decoration: none;
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
    }
    nav a:hover, nav a.is-on { color: #fff; background: #2c2c32; }
    .phone {
      width: 390px;
      height: 844px;
      max-height: calc(100vh - 64px);
      border-radius: 36px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 0 10px #111, 0 18px 48px rgba(0, 0, 0, 0.5);
      flex: 0 0 auto;
    }
    iframe {
      width: 390px;
      height: 100%;
      border: 0;
      display: block;
      background: #6fa8c9;
    }
  </style>
</head>
<body>
  <nav>
    <a data-game="transword" href="?game=transword">TransWord</a>
    <a data-game="polywordlot" href="?game=polywordlot">PolyWordlot</a>
    <a data-game="polyhydra" href="?game=polyhydra">Hydra</a>
    <a data-game="letterix" href="?game=letterix">Letterix</a>
  </nav>
  <div class="phone">
    <iframe id="frame" title="iPhone game preview"></iframe>
  </div>
  <script type="module">
    import { gameUrl } from '../games-contract.js';
    const key = new URLSearchParams(location.search).get('game') || 'transword';
    document.getElementById('frame').src = gameUrl(key) || gameUrl('transword');
    document.querySelectorAll('nav a').forEach((link) => {
      link.classList.toggle('is-on', link.dataset.game === key);
    });
  </script>
</body>
</html>
