name = "wordaholic-stats"
main = "src/index.js"
compatibility_date = "2026-08-27"
# Hourly archive (wrangler secret put, do not commit):
#   GCS_BUCKET
#   GCS_HMAC_ACCESS_KEY
#   GCS_HMAC_SECRET
# Anonymous word reports (wrangler secret put, do not commit):
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID    the chat the bot is allowed to post in
# Topic ids are configuration, not secrets:
#   TELEGRAM_TOPIC_MISSING
#   TELEGRAM_TOPIC_QUESTIONABLE

[vars]
TELEGRAM_TOPIC_MISSING = "15"
TELEGRAM_TOPIC_QUESTIONABLE = "18"

[[durable_objects.bindings]]
name = "STATS"
class_name = "StatsStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StatsStore"]

[[routes]]
pattern = "wordaholic.volvovski.com/api/*"
zone_name = "volvovski.com"

# Prefix: exact /stats does not match /stats/ (browsers and links often add the slash).
[[routes]]
pattern = "wordaholic.volvovski.com/stats*"
zone_name = "volvovski.com"
